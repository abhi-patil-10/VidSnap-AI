{% extends "base.html" %}

{% block title %}Gallery - AI Reel Generator{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/gallery.css') }}">
{% endblock %}

{% block content %}
<style>
<!-- .gallary-grid video{
    width: 340px
} -->
</style>
<div class="container gallery-container">
    <h1 class="gallery-title">Reel Gallery</h1>
    <div class="gallery-grid">
        <!-- Example reels - these would be populated dynamically in a real application -->
      
        {% for reel in reels %}
            <video src="/static/reels/{{ reel }}" controls style="width: 340px; border-radius: 15px;"></video>
        {% endfor %}
        
       

    </div>
</div>
{% endblock %}
